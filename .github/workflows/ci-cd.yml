name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: Catalogo

env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}

jobs:
  quality:
    name: Lint, tests y build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Catalogo/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium para E2E
        run: npx playwright install --with-deps chromium

      - name: Ejecutar lint
        run: npm run lint

      - name: Ejecutar tests unitarios y verificar cobertura
        run: npm run test:coverage

      - name: Ejecutar test E2E
        run: npm run test:e2e

      - name: Generar build web
        run: npm run build

      - name: Guardar build como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: catalogo-web
          path: Catalogo/dist
          retention-days: 7

  deploy:
    name: Deploy a producción
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Catalogo/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Desplegar en Vercel
        run: npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
